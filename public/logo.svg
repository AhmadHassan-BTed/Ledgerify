<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ledgerify-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="ledgerify-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2f42" />
      <stop offset="100%" stop-color="#1b1b26" />
    </linearGradient>
    <linearGradient id="ledgerify-spine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="ledgerify-tier-mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ledgerify-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="ledgerify-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Obsidian Badge Tile -->
  <rect width="64" height="64" rx="16" fill="url(#ledgerify-tile)" stroke="url(#ledgerify-border)" stroke-width="1.5" />

  <!-- Ledger Monogram: Vertical Spine & Foundation Base -->
  <path
    d="M19 15C16.7909 15 15 16.7909 15 19V45C15 47.2091 16.7909 49 19 49H45C47.2091 49 49 47.2091 49 45C49 42.7909 47.2091 41 45 41H23V19C23 16.7909 21.2091 15 19 15Z"
    fill="url(#ledgerify-spine)"
  />

  <!-- Mid Ledger Tier (Volume Stream) -->
  <rect x="29" y="29" width="16" height="6" rx="3" fill="url(#ledgerify-tier-mid)" />

  <!-- Top Ledger Tier (Yield Stream) -->
  <rect x="29" y="19" width="9" height="5" rx="2.5" fill="url(#ledgerify-spark)" />

  <!-- Verification Spark Node (Intelligence Apex) -->
  <circle cx="44" cy="21.5" r="3.5" fill="url(#ledgerify-spark)" filter="url(#ledgerify-glow)" />
</svg>
